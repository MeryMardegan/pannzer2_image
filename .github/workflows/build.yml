name: pannzer2

on:
  push:
    branches: [ main ] # dispara em push na branch main
    tags : [ 'v*' ] # dispara em push de tags que comecem com v
  workflow_dispatch: # permite rodar manualmente pelo UI

concurrency:
  group: pannzer2-${{ github.ref }} # 1 build por ref (branch ou tag)
  cancel-in-progress: true # cancela builds concorrentes da mesma ref

jobs:
  build-and-push:
    runs-on: ubuntu-latest # runner padrãdo do Github

    permissions:
      contents: read # ler o repositório
      packages: write # publicar no GHCR com GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # baixa o código do repo no runner

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: | 
          ghcr.io/${{ github.repository_owner }}/pannzer2 # nome base da imagem
          tags: |
            type=raw,value=latest,enable={{is_default_branch}} # tag latest na branch default
            type=ref,event=tag # gera tag = nome da tag do git
            type=sha,format=short # gera tag = sha do commit
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      
      - name: Set up QEMU
        if: false
        uses: docker/setup-qemu-action@v3 # habilita binários qemu para build multi-arquitetura

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # habilita o buildx do docker para build multi-arquitetura

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # usuário atual do github
          password: ${{ secrets.GITHUB_TOKEN }} # token automático do actions

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # diretório onde está o Dockerfile
          file: ./Dockerfile # caminho do Dockerfile
          push: true # faz push da imagem para o registry
          platforms: linux/amd64 # build para arquitetura amd64
          tags: ${{ steps.meta.outputs.tags }} # tags geradas
          labels: ${{ steps.meta.outputs.labels }} # labels geradas
          cache-from: type=gha # usa cache do github actions
          cache-to: type=gha,mode=max # salva cache para próximos builds
          provenance: false # desliga SBOM